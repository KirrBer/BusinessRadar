services:
  backend:
    build: .
    environment:
      BUSINESSRADAR_DATA_DIR: /app/data
      BUSINESSRADAR_DEMO: "${BUSINESSRADAR_DEMO:-false}"
    expose:
      - "8000"
    volumes:
      - type: bind
        source: "${BUSINESSRADAR_HOST_DATA_DIR:-./data}"
        target: /app/data
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 2m

  frontend:
    build: ./frontend
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true